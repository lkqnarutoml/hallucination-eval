<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="680" height="1070" viewBox="0 0 680 1070" font-family="Helvetica, Arial, sans-serif">
  <title>hallucination-eval 0.4.0 workflow overview with agent roles</title>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#5F5E5A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="680" height="1070" fill="#FFFFFF"/>

  <rect x="240" y="40" width="200" height="56" rx="8" fill="#FFFFFF" stroke="#888780" stroke-width="1"/>
  <text x="340" y="63" text-anchor="middle" font-size="14" font-weight="bold" fill="#2C2C2A">input/ folder</text>
  <text x="340" y="80" text-anchor="middle" font-size="12" fill="#5F5E5A">code, logs, ground truth</text>
  <line x1="340" y1="96" x2="340" y2="132" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="190" y="136" width="300" height="56" rx="8" fill="#FFFFFF" stroke="#888780" stroke-width="1"/>
  <text x="340" y="159" text-anchor="middle" font-size="14" font-weight="bold" fill="#2C2C2A">P0 setup · orchestrator</text>
  <text x="340" y="176" text-anchor="middle" font-size="12" fill="#5F5E5A">audit yes/no, P6 and P7 models</text>
  <path d="M340 192 L340 212 L180 212 L180 228" fill="none" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>
  <path d="M340 192 L340 212 L500 212 L500 228" fill="none" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="50" y="232" width="260" height="56" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="1"/>
  <text x="180" y="255" text-anchor="middle" font-size="14" font-weight="bold" fill="#3C3489">P1 inventory · orchestrator</text>
  <text x="180" y="272" text-anchor="middle" font-size="12" fill="#534AB7">tree of agents and tools</text>
  <rect x="370" y="232" width="260" height="56" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1"/>
  <text x="500" y="255" text-anchor="middle" font-size="14" font-weight="bold" fill="#085041">P4 normalizer · subagent</text>
  <text x="500" y="272" text-anchor="middle" font-size="12" fill="#0F6E56">redacted, ordered events</text>
  <line x1="180" y1="288" x2="180" y2="324" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="500" y1="288" x2="500" y2="324" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="50" y="328" width="260" height="56" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="1"/>
  <text x="180" y="351" text-anchor="middle" font-size="14" font-weight="bold" fill="#3C3489">P2 architect · subagent</text>
  <text x="180" y="368" text-anchor="middle" font-size="12" fill="#534AB7">code to pseudocode, no logs</text>
  <rect x="370" y="328" width="260" height="56" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1"/>
  <text x="500" y="351" text-anchor="middle" font-size="14" font-weight="bold" fill="#085041">Batches</text>
  <text x="500" y="368" text-anchor="middle" font-size="12" fill="#0F6E56">12 conversations, 40k chars</text>
  <line x1="180" y1="384" x2="180" y2="420" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="500" y1="384" x2="500" y2="420" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="50" y="424" width="260" height="56" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="1"/>
  <text x="180" y="447" text-anchor="middle" font-size="14" font-weight="bold" fill="#3C3489">P3 spec auditor · subagent</text>
  <text x="180" y="464" text-anchor="middle" font-size="12" fill="#534AB7">approve or revise, max twice</text>
  <rect x="370" y="424" width="260" height="56" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1"/>
  <text x="500" y="447" text-anchor="middle" font-size="14" font-weight="bold" fill="#085041">P5 checker · subagent</text>
  <text x="500" y="464" text-anchor="middle" font-size="12" fill="#0F6E56">optional; mechanical checks first</text>
  <path d="M180 480 L180 500 L340 500 L340 516" fill="none" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>
  <path d="M500 480 L500 500 L340 500 L340 516" fill="none" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="190" y="520" width="300" height="56" rx="8" fill="#FFFFFF" stroke="#888780" stroke-width="1"/>
  <text x="340" y="543" text-anchor="middle" font-size="14" font-weight="bold" fill="#2C2C2A">Budget check · orchestrator</text>
  <text x="340" y="560" text-anchor="middle" font-size="12" fill="#5F5E5A">over budget: re-split, stricter diet</text>
  <line x1="340" y1="576" x2="340" y2="612" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="190" y="616" width="300" height="56" rx="8" fill="#FAECE7" stroke="#993C1D" stroke-width="1"/>
  <text x="340" y="639" text-anchor="middle" font-size="14" font-weight="bold" fill="#712B13">P6 evaluators · subagents</text>
  <text x="340" y="656" text-anchor="middle" font-size="12" fill="#993C1D">one per batch, pseudocode only</text>
  <line x1="340" y1="672" x2="340" y2="708" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>
  <path d="M490 644 L545 644 L545 836 L494 836" fill="none" stroke="#5F5E5A" stroke-width="1.5" stroke-dasharray="6 4" marker-end="url(#arrow)"/>
  <text x="551" y="744" font-size="12" fill="#5F5E5A">audit skipped</text>

  <rect x="190" y="712" width="300" height="56" rx="8" fill="#FAECE7" stroke="#993C1D" stroke-width="1"/>
  <text x="340" y="735" text-anchor="middle" font-size="14" font-weight="bold" fill="#712B13">P7 auditors, blind · subagents</text>
  <text x="340" y="752" text-anchor="middle" font-size="12" fill="#993C1D">optional; confirm, revise, reject</text>
  <line x1="340" y1="768" x2="340" y2="804" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="190" y="808" width="300" height="56" rx="8" fill="#FFFFFF" stroke="#888780" stroke-width="1"/>
  <text x="340" y="831" text-anchor="middle" font-size="14" font-weight="bold" fill="#2C2C2A">P8 reporter · subagent</text>
  <text x="340" y="848" text-anchor="middle" font-size="12" fill="#5F5E5A">merge, mask; UNAUDITED if skipped</text>
  <line x1="340" y1="864" x2="340" y2="900" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="190" y="904" width="300" height="56" rx="8" fill="#FFFFFF" stroke="#888780" stroke-width="1"/>
  <text x="340" y="927" text-anchor="middle" font-size="14" font-weight="bold" fill="#2C2C2A">output/&lt;RUN_ID&gt;/</text>
  <text x="340" y="944" text-anchor="middle" font-size="12" fill="#5F5E5A">findings, summary, pseudocode, views</text>

  <rect x="50" y="992" width="12" height="12" rx="2" fill="#EEEDFE" stroke="#534AB7" stroke-width="1"/>
  <text x="68" y="1002" font-size="12" fill="#444441">code only, never logs</text>
  <rect x="245" y="992" width="12" height="12" rx="2" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1"/>
  <text x="263" y="1002" font-size="12" fill="#444441">logs only, no pseudocode</text>
  <rect x="461" y="992" width="12" height="12" rx="2" fill="#FAECE7" stroke="#993C1D" stroke-width="1"/>
  <text x="479" y="1002" font-size="12" fill="#444441">judges both, one batch</text>
  <text x="50" y="1024" font-size="12" fill="#444441">orchestrator: the main agent that reads SKILL.md, runs the scripts and dispatches the roles</text>
  <text x="50" y="1044" font-size="12" fill="#444441">subagent: an isolated instance with a fresh context, one per dispatch, never reused</text>
</svg>
